name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy: staging, production, or all'
        required: true
        default: 'staging'
      ref:
        description: 'Optional git ref to deploy (branch or tag)'
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpwd
          POSTGRES_DB: kollector_test
        options: >-
          --health-cmd="pg_isready -U root -d kollector_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore kollector-scum.sln

      - name: Build backend
        run: dotnet build kollector-scum.sln --configuration Release --no-restore

      - name: Run backend tests
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=kollector_test;Username=root;Password=rootpwd
        run: dotnet test backend/KollectorScum.Tests/KollectorScum.Tests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t kollector-scum-api:ci backend

  frontend:
    name: Frontend Lint Test Build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5072
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE__CLIENTID }}
        run: npm test -- --ci --runInBand

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5072
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE__CLIENTID }}
        run: npm run build

  deploy-coolify-staging:
    name: Deploy API to Coolify Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID_STAGING: ${{ secrets.COOLIFY_APP_UUID_STAGING }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID_STAGING" ]; then
            echo "Missing COOLIFY_API_TOKEN or COOLIFY_APP_UUID_STAGING"
            exit 1
          fi
          curl -fsS -X POST "https://coolify.kollector-skum.com/api/v1/deploy?uuid=${COOLIFY_APP_UUID_STAGING}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json"

  deploy-render-production:
    name: Deploy API to Render Production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_PROD: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_PROD" ]; then
            echo "Missing RENDER_API_KEY or RENDER_SERVICE_ID_PROD"
            exit 1
          fi
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_PROD}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

  deploy-pages:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for Cloudflare Pages
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ github.ref == 'refs/heads/dev' && secrets.NEXT_PUBLIC_API_BASE_URL_STAGING || secrets.NEXT_PUBLIC_API_BASE_URL_PROD }}
          # master and main both deploy to production
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE__CLIENTID }}
          NEXT_PUBLIC_API_TIMEOUT_MS: "20000"
        run: npx @cloudflare/next-on-pages@1

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          npx wrangler pages project create kollector-scum-frontend --production-branch=main 2>/dev/null || true
          npx wrangler pages deploy .vercel/output/static \
            --project-name=kollector-scum-frontend \
            --branch="$BRANCH_NAME" \
            --commit-dirty=true

  manual-deploy:
    name: Manual Deploy (workflow_dispatch)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy API to Coolify (Staging)
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'all' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID_STAGING: ${{ secrets.COOLIFY_APP_UUID_STAGING }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID_STAGING" ]; then
            echo "Missing COOLIFY_API_TOKEN or COOLIFY_APP_UUID_STAGING"
            exit 1
          fi
          curl -fsS -X POST "https://coolify.kollector-skum.com/api/v1/deploy?uuid=${COOLIFY_APP_UUID_STAGING}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Deploy API to Render (Production)
        if: ${{ github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_PROD: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_PROD" ]; then
            echo "Missing RENDER_API_KEY or RENDER_SERVICE_ID_PROD"
            exit 1
          fi
          curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID_PROD}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Setup Node (for frontend deploy)
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all' }}
        working-directory: frontend
        run: npm ci

      - name: Set BRANCH for frontend deploy
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all' }}
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            BRANCH="$INPUT_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Build for Cloudflare Pages
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all' }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ github.event.inputs.environment == 'staging' && secrets.NEXT_PUBLIC_API_BASE_URL_STAGING || secrets.NEXT_PUBLIC_API_BASE_URL_PROD }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE__CLIENTID }}
          NEXT_PUBLIC_API_TIMEOUT_MS: "20000"
        run: npx @cloudflare/next-on-pages@1

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all' }}
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="$BRANCH"
          npx wrangler pages project create kollector-scum-frontend --production-branch=main 2>/dev/null || true
          npx wrangler pages deploy .vercel/output/static \
            --project-name=kollector-scum-frontend \
            --branch="$BRANCH" \
            --commit-dirty=true

  staging-health:
    name: Staging Health Check
    runs-on: ubuntu-latest
    needs: deploy-coolify-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Check staging health endpoint
        run: |
          STAGING_URL="https://kollector-scum-staging-api.onrender.com/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 3 "$STAGING_URL")
          if [ "$STATUS" != "200" ]; then
            echo "Staging health check failed with HTTP status: $STATUS"
            exit 1
          fi
          echo "Staging is healthy"

  production-health:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-render-production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Check production health endpoint
        run: |
          PROD_URL="https://kollector-scum-api.onrender.com/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 3 "$PROD_URL")
          if [ "$STATUS" != "200" ]; then
            echo "Production health check failed with HTTP status: $STATUS"
            exit 1
          fi
          echo "Production is healthy"