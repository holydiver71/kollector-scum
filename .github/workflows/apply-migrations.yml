name: Apply EF Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging|production)'
        required: false
        default: 'staging'

jobs:
  apply-migrations:
    name: Apply migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Ensure script is executable
        run: |
          chmod +x backend/scripts/apply-ef-migrations.sh

      - name: Write temporary .env from GitHub Secrets
        env:
          KOLLECTOR_STAGING_DB_URL: ${{ secrets.KOLLECTOR_STAGING_DB_URL }}
          KOLLECTOR_PROD_DB_URL: ${{ secrets.KOLLECTOR_PROD_DB_URL }}
        run: |
          if [ -z "$KOLLECTOR_STAGING_DB_URL" ] || [ -z "$KOLLECTOR_PROD_DB_URL" ]; then
            echo "Missing KOLLECTOR_STAGING_DB_URL or KOLLECTOR_PROD_DB_URL secret" >&2
            exit 1
          fi
          {
            echo "KOLLECTOR_STAGING_DB_URL=\"$KOLLECTOR_STAGING_DB_URL\""
            echo "KOLLECTOR_PROD_DB_URL=\"$KOLLECTOR_PROD_DB_URL\""
          } > .env

      - name: Run migrations
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            ./backend/scripts/apply-ef-migrations.sh --production
          else
            ./backend/scripts/apply-ef-migrations.sh --staging
          fi

      - name: Cleanup .env
        if: always()
        run: rm -f .env
