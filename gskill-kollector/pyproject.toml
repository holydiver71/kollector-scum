[project]
name = "gskill-kollector"
version = "0.1.0"
description = "Adapted gskill pipeline for kollector-scum (.NET 8 + Next.js 15)"
requires-python = ">=3.13"
dependencies = [
    "gepa>=0.1.0",
    "openai>=1.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
